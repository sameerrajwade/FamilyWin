<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css"><style>
.login-body { padding: 0 24px; flex: 1; display: flex; flex-direction: column; }
.logo-section { text-align: center; padding-top: 40px; }
.logo-emoji { font-size: 56px; }
.logo-name { font-family: 'Poppins', sans-serif; font-size: 30px; font-weight: 900; color: var(--primary); margin-top: 4px; }
.logo-tagline { font-size: 13px; color: var(--text-secondary); font-weight: 600; margin-top: 2px; }
.welcome { font-size: 22px; font-weight: 800; margin-top: 36px; margin-bottom: 20px; }
.input-group { margin-bottom: 14px; }
.input-label { font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
.input {
  width: 100%; height: 50px; background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 0 16px; font-size: 15px; color: var(--text-muted);
  display: flex; align-items: center; font-weight: 600;
}
.forgot { text-align: right; font-size: 13px; font-weight: 700; color: var(--primary); margin: 4px 0 20px; }
.divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
.divider-line { flex: 1; height: 1px; background: var(--border); }
.divider-text { font-size: 12px; font-weight: 800; color: var(--text-muted); }
.google-btn {
  width: 100%; height: 50px; background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 10px;
  font-size: 15px; font-weight: 700; color: var(--text);
}
.google-g { width: 22px; height: 22px; background: #fff; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: #4285F4; }
.signup-link { text-align: center; margin-top: 24px; font-size: 14px; font-weight: 600; color: var(--text-secondary); }
.signup-link b { color: var(--primary); font-weight: 800; }
</style></head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <div class="right"><span>📶</span><span>🔋</span></div>
  </div>
  <div class="login-body">
    <div class="logo-section">
      <div class="logo-emoji">🏆</div>
      <div class="logo-name">Lootboard</div>
      <div class="logo-tagline">Your family's weekly showdown</div>
    </div>
    <div class="welcome">Welcome back!</div>
    <div class="input-group">
      <div class="input-label">Email</div>
      <div class="input">your@email.com</div>
    </div>
    <div class="input-group">
      <div class="input-label">Password</div>
      <div class="input">••••••••</div>
    </div>
    <div class="forgot">Forgot password?</div>
    <div class="btn-primary">Sign In</div>
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">OR</div>
      <div class="divider-line"></div>
    </div>
    <div class="google-btn">
      <div class="google-g">G</div>
      Continue with Google
    </div>
    <div class="signup-link">Don't have an account? <b>Sign Up</b></div>
  </div>
</div>
</body></html>
