<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css"><style>
.body-pad { padding: 80px 24px 0; }
.step-emoji { font-size: 64px; text-align: center; }
.step-title { font-family: 'Poppins', sans-serif; font-size: 26px; font-weight: 900; text-align: center; margin-top: 16px; }
.step-sub { font-size: 15px; font-weight: 600; color: var(--text-secondary); text-align: center; margin-top: 8px; margin-bottom: 44px; }

.choice {
  background: var(--card); border: 1px solid var(--border); border-radius: 18px;
  padding: 22px; display: flex; align-items: center; gap: 16px; margin-bottom: 18px;
}
.choice.primary { border: 2px solid var(--primary); background: rgba(45,122,255,0.08); }
.choice-emoji { font-size: 36px; }
.choice-text { flex: 1; }
.choice-title { font-size: 17px; font-weight: 800; }
.choice-desc { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-top: 4px; line-height: 1.4; }
.choice-arrow { font-size: 22px; color: var(--primary); font-weight: 900; }
</style></head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <div class="right"><span>📶</span><span>🔋</span></div>
  </div>
  <div class="content body-pad">
    <div class="step-emoji">👨‍👩‍👧‍👦</div>
    <div class="step-title">Welcome to Lootboard!</div>
    <div class="step-sub">Set up your family to get started</div>

    <div class="choice primary">
      <div class="choice-emoji">🏠</div>
      <div class="choice-text">
        <div class="choice-title">Create a New Family</div>
        <div class="choice-desc">Start fresh — you'll get an invite code to share</div>
      </div>
      <div class="choice-arrow">→</div>
    </div>

    <div class="choice">
      <div class="choice-emoji">🔗</div>
      <div class="choice-text">
        <div class="choice-title">Join Existing Family</div>
        <div class="choice-desc">Enter an invite code from your family admin</div>
      </div>
      <div class="choice-arrow">→</div>
    </div>
  </div>
</div>
</body></html>
