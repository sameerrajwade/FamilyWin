# Maestro E2E config for Lootboard
# Run a single flow:   maestro test .maestro/flows/01-login.yaml
# Run the whole suite:  maestro test .maestro/flows
#
# Credentials come from the environment so no test account is committed:
#   MAESTRO_EMAIL / MAESTRO_PASSWORD  (a throwaway family account)
# See .maestro/README.md for setup.
appId: com.familywin.app
---
# Execution order for `maestro test .maestro/flows`
flows:
  - flows/01-login.yaml
  - flows/02-tab-navigation.yaml
  - flows/03-complete-task.yaml
  - flows/04-create-task.yaml
  - flows/05-redeem-reward.yaml
